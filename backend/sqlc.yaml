version: "2"
sql:
  - engine: postgresql
    schema: internal/db/migrations
    queries: internal/db/query
    gen:
      go:
        package: query
        out: internal/db/query
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type: {import: github.com/google/uuid, type: UUID, pointer: true}
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type: {import: time, type: Time, pointer: true}
          - db_type: date
            go_type: time.Time
