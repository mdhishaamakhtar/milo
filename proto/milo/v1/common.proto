syntax = "proto3";

package milo.v1;

import "google/protobuf/timestamp.proto";

// Row messages shared by sync and by Milo's cards. Every synced row carries
// updated_at (last write wins) and a deleted flag (tombstone).

enum WeightUnit {
  WEIGHT_UNIT_UNSPECIFIED = 0;
  WEIGHT_UNIT_KG = 1;
  WEIGHT_UNIT_LB = 2;
}

// How an exercise is measured.
enum Measurement {
  MEASUREMENT_UNSPECIFIED = 0;
  // Reps at a weight. Counts toward volume.
  MEASUREMENT_REPS_LOAD = 1;
  // Reps at body weight. Weight, if any, is added load.
  MEASUREMENT_BODYWEIGHT = 2;
  // Reps with assistance. Weight is the assistance.
  MEASUREMENT_ASSISTED = 3;
  // Held or done for a time.
  MEASUREMENT_TIMED = 4;
  // Covered a distance.
  MEASUREMENT_DISTANCE = 5;
}

enum SetKind {
  SET_KIND_UNSPECIFIED = 0;
  SET_KIND_NORMAL = 1;
  SET_KIND_WARMUP = 2;
  SET_KIND_DROP = 3;
  SET_KIND_FAILURE = 4;
}

message Exercise {
  string id = 1;
  // True for Milo's built-in library (shared, read-only to users).
  bool builtin = 2;
  string name = 3;
  repeated string aliases = 4;
  repeated string primary_muscles = 5;
  repeated string secondary_muscles = 6;
  string movement_pattern = 7;
  string equipment = 8;
  Measurement measurement = 9;
  bool unilateral = 10;
  // Metabolic equivalent used for calories. Unset means the default (5.0).
  optional double met = 11;
  string description = 12;
  // Milo's guess, not yet confirmed by the user.
  bool approximate = 13;
  google.protobuf.Timestamp updated_at = 14;
  bool deleted = 15;
}

// A user's per-exercise preferences. Keyed by exercise_id (one per exercise per user).
message ExercisePref {
  string exercise_id = 1;
  WeightUnit unit = 2;
  // Rest after a set, in seconds. Unset means the user's default.
  optional int32 rest_s = 3;
  google.protobuf.Timestamp updated_at = 4;
  bool deleted = 5;
}

message Workout {
  string id = 1;
  string name = 2;
  string notes = 3;
  google.protobuf.Timestamp started_at = 4;
  // Unset while the workout is running.
  google.protobuf.Timestamp ended_at = 5;
  string template_id = 6;
  // The Apple Health workout this was saved as, if any.
  string health_uuid = 7;
  google.protobuf.Timestamp updated_at = 8;
  bool deleted = 9;
}

message WorkoutExercise {
  string id = 1;
  string workout_id = 2;
  string exercise_id = 3;
  int32 position = 4;
  // Superset or circuit label, e.g. "4a" and "4b" share group "4".
  string group_label = 5;
  string notes = 6;
  google.protobuf.Timestamp updated_at = 7;
  bool deleted = 8;
}

message Set {
  string id = 1;
  string workout_exercise_id = 2;
  int32 position = 3;
  SetKind kind = 4;
  optional int32 reps = 5;
  // Exact decimal as entered, e.g. "45" or "20.41". Empty when there is no weight.
  string weight = 6;
  WeightUnit weight_unit = 7;
  // Reps were done on each side ("12 each side").
  bool per_side = 8;
  optional int32 duration_s = 9;
  optional double distance_m = 10;
  optional double rpe = 11;
  // Ticked off. Pre-filled sets stay unticked until done.
  bool done = 12;
  google.protobuf.Timestamp updated_at = 13;
  bool deleted = 14;
}

message TemplateItem {
  string exercise_id = 1;
  string group_label = 2;
}

// A template is only an ordered list of exercises; numbers come from last time.
message Template {
  string id = 1;
  string name = 2;
  string notes = 3;
  repeated TemplateItem items = 4;
  google.protobuf.Timestamp updated_at = 5;
  bool deleted = 6;
}

message BodyMeasurement {
  string id = 1;
  google.protobuf.Timestamp measured_at = 2;
  optional double weight_kg = 3;
  optional double body_fat_pct = 4;
  // "manual", "health" or "hevy".
  string source = 5;
  google.protobuf.Timestamp updated_at = 6;
  bool deleted = 7;
}

// One per user.
message Settings {
  // Unit for totals and charts.
  WeightUnit display_unit = 1;
  int32 rest_default_s = 2;
  optional double height_cm = 3;
  // ISO date, e.g. "2001-03-12". Empty when unknown.
  string birth_date = 4;
  // "male", "female", "other" or empty.
  string sex = 5;
  google.protobuf.Timestamp updated_at = 6;
}

// One row, of any kind, being created, changed or deleted.
message Change {
  oneof row {
    Exercise exercise = 1;
    ExercisePref exercise_pref = 2;
    Workout workout = 3;
    WorkoutExercise workout_exercise = 4;
    Set set = 5;
    Template template = 6;
    BodyMeasurement body_measurement = 7;
    Settings settings = 8;
  }
}

// The version of a row a Milo card was based on, so a stale card can be refused.
message RowVersion {
  // "exercise", "exercise_pref", "workout", "workout_exercise", "set", "template".
  string table = 1;
  string id = 2;
  google.protobuf.Timestamp updated_at = 3;
}
