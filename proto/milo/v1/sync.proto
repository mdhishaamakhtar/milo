syntax = "proto3";

package milo.v1;

import "milo/v1/common.proto";

// Push local changes, then pull everything newer than the cursor.
service SyncService {
  rpc Sync(SyncRequest) returns (SyncResponse);
}

message SyncRequest {
  // The cursor from the last response; 0 on first sync.
  int64 cursor = 1;
  // Local rows changed since the last successful push.
  repeated Change changes = 2;
}

message SyncResponse {
  int64 cursor = 1;
  // Rows changed on the server after the request cursor, tombstones included.
  repeated Change changes = 2;
  // Call again with the new cursor (and no changes) to get the rest.
  bool has_more = 3;
}
