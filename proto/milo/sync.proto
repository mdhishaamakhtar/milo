syntax = "proto3";

package milo;

import "milo/common.proto";

// Push local changes, then pull everything newer than the cursor.
service SyncService {
  rpc Sync(SyncRequest) returns (SyncResponse);
}

message SyncRequest {
  // The cursor from the last response; 0 on first sync.
  int64 cursor = 1;
  // Local rows changed since the last successful push.
  repeated Change changes = 2;
}

message SyncResponse {
  int64 cursor = 1;
  // Rows changed on the server after the request cursor, tombstones included.
  repeated Change changes = 2;
  // Call again with the new cursor (and no changes) to get the rest.
  bool has_more = 3;
  // Pushed changes the server couldn't store. The rest of the push was kept, so
  // one bad row never holds up the others.
  repeated Rejection rejected = 4;
}

message Rejection {
  // Where the change was in the request's changes, from 0.
  int32 index = 1;
  // Why, for the app's log.
  string reason = 2;
}
